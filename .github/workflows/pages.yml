name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "core/**"
      - "cmd/**"
      - "schema/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: example reports
        run: |
          mkdir -p site/examples
          go run ./cmd/veval render --format html core/report/testdata/worked-example.json -o site/examples/example-report-code-review.html
          go run ./cmd/veval render --format html core/report/testdata/extended-example.json -o site/examples/example-report-service-change.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
