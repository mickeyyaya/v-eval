name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    name: markdownlint and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules/**
      - name: link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments './**/*.md'
          fail: true

  docs-tools:
    name: docs tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: python -m unittest discover -s tools/docs -p "test_*.py" -v
      - name: release tooling unit tests
        run: python -m unittest discover -s tools/release -p "test_*.py" -v
      - name: source register is current
        run: python tools/docs/vdocs.py register . --check
